# Deploy to Vercel production on every push to main (e.g. after merging a Builder PR).
# Requires GitHub secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
# Get them from Vercel: Project Settings → General (Project ID, Org ID), Account → Tokens (token).
name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      feature_description:
        description: "What you are shipping (logged in the workflow summary)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Vercel CLI reads these automatically in CI (no --token needed if VERCEL_TOKEN is set).
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not set. Add it under Repo → Settings → Secrets → Actions (Vercel → Account Settings → Tokens)."
            exit 1
          fi

      - name: Deployment context
        env:
          FEATURE_NOTE: ${{ github.event.inputs.feature_description }}
        run: |
          {
            echo "## Production deploy"
            echo ""
            echo "**Trigger:** ${{ github.event_name }}"
            echo ""
            echo "**Feature / release note:**"
            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$FEATURE_NOTE" ]; then
              printf '%s\n' "$FEATURE_NOTE"
            else
              echo "(automatic deploy from push to main — no manual note)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Use npx (not pnpm dlx) so the CLI inherits env reliably; pass --token explicitly
      # (some Vercel versions resolve credentials before reading VERCEL_TOKEN in non-TTY).
      - name: Pull Vercel env and build
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"
          npx --yes vercel@latest build --prod --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Deploy to Vercel production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
